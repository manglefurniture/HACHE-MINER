name: Quality
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vast-ingest:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: hache_miner_vast_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_mysql
      - name: Signed eight-GPU telemetry through MariaDB and pure stop decisions
        env:
          MINER_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=hache_miner_vast_test;charset=utf8mb4'
          MINER_DB_USER: root
          MINER_DB_PASSWORD: test-only-password
        run: php tests/vast-ingest-integration.php
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: sodium, pdo_mysql, mbstring, curl
      - name: Syntax
        run: find app public bin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bootstrap scripts syntax
        run: bash -n deploy/*.sh
      - name: Vast onstart regression
        run: bash tests/vast-onstart-regression.sh
      - name: Vast managed preparation and collector regressions
        run: |
          python3 -m py_compile deploy/vast-instance-prepare.py deploy/vast-collector.py
          python3 tests/vast-instance-prepare-regression.py
      - name: Restricted Vast forced-command SSH receiver
        run: |
          python3 -m py_compile deploy/vast-secure-receiver.py
          python3 tests/vast-secure-receiver-regression.py
      - name: Security regression
        run: |
          php tests/core-regression.php
          php tests/safetrade-regression.php
          php tests/salad-gpu-prices-regression.php
          php tests/salad-gpu-identity-regression.php
          php tests/salad-log-coverage-regression.php
          php tests/salad-instance-id-diagnostic-regression.php
          php tests/kryptex-regression.php
          php tests/pool-observation-regression.php
          php tests/monitor-regression.php
          php tests/monitor-gpu-names-regression.php
          php tests/shares-learning-regression.php
          php tests/trial-history-regression.php
          php tests/history-summary-regression.php
          php tests/reallocation-regression.php
          php tests/interactive-auto-regression.php
          php tests/accounting-regression.php
          php tests/salad-credits-regression.php
          php tests/remember-regression.php
          php tests/deploy-regression.php
          php tests/diagnostics-regression.php
          php tests/vast-regression.php
          php tests/vast-watchdog-regression.php
          php tests/vast-auto-stop-regression.php
          python3 tests/vast-collector-regression.py
      - name: Public artifact must not contain local secrets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.production
          test ! -e config.local.php
          ! git ls-files | grep -E '(^|/)(master\.key|id_rsa|id_ed25519|\.env|credentials\.json|ledger\.json)$'
